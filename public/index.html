<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>AI RAG Chatbot</title>

    <!-- Bootstrap -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Bootstrap Icons -->

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- CSS -->

    <link rel="stylesheet"
          href="style.css">

</head>

<body>

    <!-- Navbar -->

    <nav class="navbar navbar-dark bg-primary">

        <div class="container">

            <span class="navbar-brand fw-bold">

                🤖 AI RAG Chatbot

            </span>

            <button
                id="themeBtn"
                class="btn btn-light">

                🌙 Dark Mode

            </button>

        </div>

    </nav>


    <div class="container mt-4">

        <div class="row">

            <!-- Upload Card -->

            <div class="col-lg-4">

                <div class="card shadow">

                    <div class="card-header">

                        <h5>

                            Upload Document

                        </h5>

                    </div>

                    <div class="card-body">

                        <input

                            type="file"

                            id="fileInput"

                            class="form-control"

                            accept=".pdf,.txt,.docx,.csv">

                        <button

                            id="uploadBtn"

                            class="btn btn-primary w-100 mt-3">

                            Upload

                        </button>

                        <hr>

                        <div id="uploadStatus"></div>

                        <div class="mt-4">

                            <button

                                id="clearBtn"

                                class="btn btn-danger w-100">

                                Clear Chat

                            </button>

                        </div>

                    </div>

                </div>

            </div>


            <!-- Chat -->

            <div class="col-lg-8">

                <div class="card shadow">

                    <div class="card-header">

                        <h5>

                            AI Chat

                        </h5>

                    </div>

                    <div

                        class="card-body"

                        id="chatBox">

                    </div>

                    <div class="card-footer">

                        <div class="input-group">

                            <input

                                id="questionInput"

                                type="text"

                                class="form-control"

                                placeholder="Ask anything about your document...">

                            <button

                                id="sendBtn"

                                class="btn btn-success">

                                Send

                            </button>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </div>


    <!-- Loading -->

    <div

        id="loading"

        class="loading d-none">

        <div

            class="spinner-border text-primary"

            role="status">

        </div>

        <p class="mt-2">

            AI is thinking...

        </p>

    </div>

    <!-- Bootstrap -->

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

    <!-- JS -->

    <script src="script.js"></script>

</body>

</html>
